name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい実行が始まったら古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Cloudflare への認証は不要。SPA と Worker がビルドできることだけを確認する
      - name: Build
        run: npm run build
